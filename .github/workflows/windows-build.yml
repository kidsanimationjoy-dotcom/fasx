name: Windows build

on:
  push:
    branches:
      - main
      - "production/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10 LTS SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.404"

      - name: Restore
        run: dotnet restore FASX.sln

      - name: Build
        run: dotnet build FASX.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test FASX.sln --configuration Release --no-build

      - name: Publish portable Windows x64 companion
        run: dotnet publish src/Fasx.Agent.Windows/Fasx.Agent.Windows.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/FASX-Windows-x64

      - name: Upload Windows foundation package
        uses: actions/upload-artifact@v4
        with:
          name: FASX-Windows-Foundation-win-x64
          path: artifacts/FASX-Windows-x64/
          if-no-files-found: error
